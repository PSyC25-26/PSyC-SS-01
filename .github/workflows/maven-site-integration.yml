name: build-test-docs-pages

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  MAVEN_OPTS: -Djava.awt.headless=true

jobs:
  build-test-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Make Maven wrapper executable
        run: chmod +x ./ubesto/mvnw

      - name: Run unit, integration and acceptance tests with JaCoCo
        working-directory: ./ubesto
        run: ./mvnw -B clean verify -Djava.awt.headless=true -Dtest=UbestoApplicationTests,AceptacionTest,BacklogStoriesTest

      - name: Run performance tests
        working-directory: ./ubesto
        run: ./mvnw -B test -Pperformance -Djava.awt.headless=true
        continue-on-error: true

      - name: Build GitHub Pages with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./public

      - name: Attach JaCoCo report to Pages artifact
        run: |
          if [ -d ubesto/target/site/jacoco ]; then
            mkdir -p public/jacoco
            cp -R ubesto/target/site/jacoco/* public/jacoco/
          fi

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/deploy-pages@v4
