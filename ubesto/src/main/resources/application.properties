spring.application.name=ubesto
server.port=${SERVER_PORT:8080}

app.ui.enabled=${APP_UI_ENABLED:true}

# H2 database configuration. Override SPRING_DATASOURCE_URL in Docker if needed.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./PSyC-SS-01/data/db;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:db-user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:db-password}
spring.sql.init.platform=h2

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
